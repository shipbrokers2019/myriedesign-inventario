<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Myriedesign Inventario</title>
<meta name="description" content="Inventario de joyería Myriedesign: piezas, ventas, entradas y resumen.">
<meta name="theme-color" content="#1D1821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Myriedesign">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="offline" class="offline" hidden>Sin conexión. Los cambios no se guardarán hasta que vuelva el internet.</div>

<!-- Login -->
<section id="login" class="login" hidden>
  <form class="login-card f" id="lf" novalidate>
    <div class="brand"><b>Myriedesign</b><small>Inventario</small></div>
    <p class="lead">Entra con el correo y la clave que te dio el administrador.</p>
    <div id="cfgWarn" class="config-warn" hidden>Falta configurar la conexión. Abre <code>config.js</code> y pega la dirección y la clave pública de tu proyecto de Supabase.</div>
    <div class="fld"><label for="lf-email">Correo</label><input id="lf-email" type="email" autocomplete="username" inputmode="email" required></div>
    <div class="fld"><label for="lf-pass">Clave</label><input id="lf-pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="lf-err" hidden></p>
    <button class="btn" type="submit" id="lf-btn">Entrar</button>
  </form>
</section>

<!-- App -->
<div id="app" hidden>
<header class="top"><div class="top-in">
  <div class="brand"><b>Myriedesign</b><small>Inventario</small></div>
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div></header>

<main>
  <section class="view" id="v-inv">
    <div id="invNotice"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nombre, medida o código" autocomplete="off">
    </div>
    <div class="chips" id="chipsTipo"></div>
    <div class="chips sub" id="chipsMat"></div>
    <div class="count" id="invCount"></div>
    <div id="invList"></div>
  </section>

  <section class="view" id="v-mov" hidden>
    <div class="row" id="movActions">
      <button class="btn" type="button" data-new="venta">Registrar venta</button>
      <button class="btn soft" type="button" data-new="entrada">Registrar entrada</button>
    </div>
    <div class="chips" id="chipsMov"></div>
    <div id="movList"></div>
  </section>

  <section class="view" id="v-res" hidden></section>
</main>

<button class="fab" id="fab" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nueva pieza</button>

<nav class="tabs"><div class="tabs-in">
  <button class="tab" type="button" data-tab="inv" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z"/></svg>Inventario</button>
  <button class="tab" type="button" data-tab="mov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5M17 20V4M17 20l-3.5-3.5M17 20l3.5-3.5"/></svg>Movimientos</button>
  <button class="tab" type="button" data-tab="res"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16v-5M12 16V7M17 16v-8"/></svg>Resumen</button>
</div></nav>
</div>

<div id="scrim" hidden></div>
<section id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-top"><div class="grab"></div><button class="sheet-x" type="button" data-act="cerrar" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="sheetBody"></div></section>
<div id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
